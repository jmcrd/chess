<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Lighten Up Chess</title>

    <!-- CSS -->
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="topbar.css">
    <link rel="stylesheet" href="splash.css">
    <link rel="stylesheet" href="quiz.css">
</head>

<body>

    <!-- Splash Screen -->
    <div id="splash">
        <div class="logo-wrapper">
            <div class="logo-circle">
                <a href="https://www.youtube.com/@LightenupChess?sub_confirmation=1" target="_blank">

        <div class="quiz-container" id="quizBox"></div>

    <script src="splashLoader.js"></script>
